# 作用：对 Go 代码执行静态检查，确保提交符合 lint 规范。
# 使用：在 push 和 pull request 到 main 分支时自动运行，用于提交前和合并前校验。
name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        env:
          GOFLAGS: -mod=mod
        with:
          version: latest
