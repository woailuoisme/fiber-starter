name: Docker Build and Push

on:
  # push:
  #   branches:
  #     - main
  #   tags:
  #     - "v*.*.*"
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      docker_username:
        description: 'Docker Hub Username'
        type: string
        default: 'jiaoio'
      
      image_name:
        description: 'Docker Image Name'
        type: string
        default: 'fiber'

env:
  DOCKERHUB_USERNAME: 'jiaoio'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ inputs.docker_username || env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # Multi-platform build
          platforms: linux/amd64,linux/arm64
          # Only push if it's not a pull request
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ inputs.docker_username || env.DOCKERHUB_USERNAME }}/${{ inputs.image_name || 'fiber' }}:starter-latest
          # Use GitHub Actions cache to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
