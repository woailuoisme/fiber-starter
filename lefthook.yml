# Lefthook Git 钩子配置
# 详细指南请参考：https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false  # 串行执行，确保格式化与静态修复的严谨执行顺序
  jobs:
    # 1. 格式化 Go 代码，规范格式缩进与语法表现
    - name: fmt
      glob: "**/*.go"
      stage_fixed: true
      run: just fmt-gofumpt

    # 2. 格式化 Swagger 注释，规整 API 文档元数据
    - name: swag-fmt
      glob: "**/*.go"
      stage_fixed: true
      run: just fmt-swag

    # 3. 运行静态代码分析并自动修复代码风格与质量缺陷
    - name: lint-fix
      glob: "**/*.go"
      stage_fixed: true
      run: just lint-fix

    # 4. 扫描 staged 变更中的 secret
    - name: gitleaks
      run: just secrets-staged
