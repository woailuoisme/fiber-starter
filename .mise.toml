[tools]
# 核心运行时与包管理器 (Runtimes & Package Managers)
go = "1.26.3"
node = "latest"
pnpm = "latest"

# 本地开发与并发运行 (Development & Orchestration)
air = "latest"
"npm:concurrently" = "latest"

# 静态检查、安全扫描与质量门禁 (Linting, Security & Quality)
gofumpt = "latest"                     # 更严格的 Go 代码格式化工具 (基于 gofmt)
golangci-lint = "latest"               # 强类型 Go 静态代码分析与 Lint 聚合器
swag = "latest"                        # Go OpenAPI/Swagger 2.0 API 文档自动生成工具
actionlint = "latest"                  # GitHub Actions 工作流 YAML 配置文件校验工具
gitleaks = "latest"                    # 本地与历史 Commit 敏感信息/密钥泄露扫描工具
gotestsum = "latest"                   # 终端彩色友好且带运行摘要分析的 Go 测试运行器
mockery = "latest"                     # 针对 Go 接口 (Interface) 自动构建单元测试 Mock 代码的工具

# 数据库变更与迁移管理 (Database Migration)
atlas = "latest"

# 项目模板与脚手架克隆 (Scaffolding & Templates)
"go:golang.org/x/tools/cmd/gonew" = "latest"

# 命令行高效检索与文本替换 (CLI Utilities)
ripgrep = "latest"
fd = "latest"
sd = "latest"

# 可观测性与监控调试工具 (Observability & Monitoring)
promtool = "latest"                     # Prometheus 配置与指标格式校验工具
loki-logcli = "latest"                  # Grafana Loki 日志查询与分析工具 (命令行 logcli)
k6 = "latest"                           # 现代化 API 压测与性能测试工具
vector = "latest"                       # 极速日志与指标管道流处理器
hurl = "latest"                         # 基于文本的 HTTP 接口冒烟测试与健康探测工具

[settings]
npm.package_manager = "pnpm"

[env]
_.file = ".env"
