services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lfiber:local
    container_name: lfiber
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-3600}:8080"
    volumes:
      - ./.env.production:/app/.env:ro
    networks:
      - backend

networks:
  backend:
    external: true


