security:
  cors:
    allowed_origins: "${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000}"
    allowed_methods: "${SECURITY_CORS_ALLOWED_METHODS:GET,POST,HEAD,PUT,DELETE,PATCH,OPTIONS}"
    allowed_headers: "${SECURITY_CORS_ALLOWED_HEADERS:Origin,Content-Type,Accept,Authorization,Cache-Control,X-Requested-With}"
  rate_limit:
    max: ${SECURITY_RATE_LIMIT_MAX:100}
    window: ${SECURITY_RATE_LIMIT_WINDOW:60}
  load_shed:
    enabled: ${SECURITY_LOAD_SHED_ENABLED:false}
    lower_threshold: ${SECURITY_LOAD_SHED_LOWER:0.85}
    upper_threshold: ${SECURITY_LOAD_SHED_UPPER:0.95}
