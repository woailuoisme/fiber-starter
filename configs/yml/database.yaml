database:
  default: ${DB_CONNECTION:postgres}
  connections:
    postgres:
      driver: postgres
      host: ${DB_HOST:localhost}
      port: ${DB_PORT:5432}
      database: ${DB_DATABASE:lfiber}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:""}
      charset: ${DB_CHARSET:utf8}
      schema: ${DB_SCHEMA:public}
      sslmode: ${DB_SSLMODE:disable}
      timezone: ${DB_TIMEZONE:UTC}
      retry_attempts: ${DB_POSTGRES_RETRY_ATTEMPTS:1}
      retry_backoff_ms: ${DB_POSTGRES_RETRY_BACKOFF_MS:100}
      retry_backoff_factor: ${DB_POSTGRES_RETRY_BACKOFF_FACTOR:2.0}
      retry_on_open: ${DB_POSTGRES_RETRY_ON_OPEN:true}
      retry_on_query: ${DB_POSTGRES_RETRY_ON_QUERY:false}
      log_queries: ${DB_POSTGRES_LOG_QUERIES:false}
      slow_query_threshold_ms: ${DB_POSTGRES_SLOW_QUERY_THRESHOLD_MS:0}
    pgsql:
      driver: postgres
      host: ${DB_HOST:localhost}
      port: ${DB_PORT:5432}
      database: ${DB_DATABASE:lfiber}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:""}
      charset: ${DB_CHARSET:utf8}
      schema: ${DB_SCHEMA:public}
      sslmode: ${DB_SSLMODE:disable}
      timezone: ${DB_TIMEZONE:UTC}
      retry_attempts: ${DB_PGSQL_RETRY_ATTEMPTS:1}
      retry_backoff_ms: ${DB_PGSQL_RETRY_BACKOFF_MS:100}
      retry_backoff_factor: ${DB_PGSQL_RETRY_BACKOFF_FACTOR:2.0}
      retry_on_open: ${DB_PGSQL_RETRY_ON_OPEN:true}
      retry_on_query: ${DB_PGSQL_RETRY_ON_QUERY:false}
      log_queries: ${DB_PGSQL_LOG_QUERIES:false}
      slow_query_threshold_ms: ${DB_PGSQL_SLOW_QUERY_THRESHOLD_MS:0}
    sqlite:
      driver: sqlite
      database: ${DB_DATABASE:./database/database.sqlite}
      prefix: ""
      retry_attempts: ${DB_SQLITE_RETRY_ATTEMPTS:1}
      retry_backoff_ms: ${DB_SQLITE_RETRY_BACKOFF_MS:100}
      retry_backoff_factor: ${DB_SQLITE_RETRY_BACKOFF_FACTOR:2.0}
      retry_on_open: ${DB_SQLITE_RETRY_ON_OPEN:true}
      retry_on_query: ${DB_SQLITE_RETRY_ON_QUERY:false}
      log_queries: ${DB_SQLITE_LOG_QUERIES:false}
      slow_query_threshold_ms: ${DB_SQLITE_SLOW_QUERY_THRESHOLD_MS:0}

  pool:
    max_open_conns: ${DB_POOL_MAX_OPEN_CONNS:100}
    max_idle_conns: ${DB_POOL_MAX_IDLE_CONNS:10}
    conn_max_lifetime: ${DB_POOL_CONN_MAX_LIFETIME:3600}
    conn_max_idle_time: ${DB_POOL_CONN_MAX_IDLE_TIME:600}

  migrations:
    table: ${DB_MIGRATIONS_TABLE:migrations}
    path: ${DB_MIGRATIONS_PATH:./database/migrations}

  seeders:
    path: ${DB_SEEDERS_PATH:./database/seeders}

redis:
  host: ${REDIS_HOST:127.0.0.1}
  password: ${REDIS_PASSWORD:""}
  port: ${REDIS_PORT:6379}
  db: ${REDIS_DB:0}
