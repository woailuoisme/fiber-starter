websocket:
  port: ${WEBSOCKET_PORT:6001}
  path: ${WEBSOCKET_PATH:/app/:appKey}
  sse_path: ${WEBSOCKET_SSE_PATH:/sse/app/:appKey}
  auth_path: /broadcasting/auth
  app_id: ${REVERB_APP_ID:lfiber}
  app_key: ${REVERB_APP_KEY:lfiber}
  app_secret: ${REVERB_APP_SECRET:}
  bus_mode: ${BROADCAST_CONNECTION:redis}
  heartbeat_interval: 30
  write_queue_size: 128
  max_message_size: 65536
  presence_ttl: 120
  url: ${CENTRIFUGO_URL:https://push.test.local/api}
  client_url: ${CENTRIFUGO_CLIENT_URL:wss://push.test.local/connection/websocket}
  client_sse_url: ${CENTRIFUGO_CLIENT_SSE_URL:https://push.test.local/connection/sse}
  api_key: ${CENTRIFUGO_API_KEY:lfiber-centrifugo-api-key}
  secret: ${CENTRIFUGO_SECRET:lfiber-centrifugo-secret}
