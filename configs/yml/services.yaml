notification:
  gotify:
    enabled: ${GOTIFY_ENABLED:false}
    url: ${GOTIFY_URL:""}
    token: ${GOTIFY_TOKEN:""}
    title: ${APP_NAME:Fiber Starter}
    priority: 5
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot_token: ${TELEGRAM_BOT_TOKEN:""}
    chat_id: ${TELEGRAM_CHAT_ID:""}

search:
  default: ${SCOUT_DRIVER:meilisearch}
  host: ${MEILISEARCH_HOST:http://localhost:7700}
  api_key: ${MEILISEARCH_KEY:""}

otel:
  enabled: ${OTEL_ENABLED:false}
  service_name: ${OTEL_SERVICE_NAME:fiber-starter}
  exporter_type: grpc
  endpoint: ${OTEL_ENDPOINT:localhost:4317}
