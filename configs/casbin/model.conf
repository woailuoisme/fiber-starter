# Casbin RBAC permission model.
# Request format: subject, object, action.
# Example: user:1 wants to perform users:list -> sub=user:1, obj=users, act=list.
[request_definition]
r = sub, obj, act

# Policy format: role or subject, object, action.
# Example: p, super_admin, users, list.
[policy_definition]
p = sub, obj, act

# Role binding format: subject, role.
# Example: g, user:1, super_admin.
[role_definition]
g = _, _

# Allow when any matching policy grants access.
[policy_effect]
e = some(where (p.eft == allow))

# A request is allowed when the subject has the policy role and object/action match exactly.
[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
